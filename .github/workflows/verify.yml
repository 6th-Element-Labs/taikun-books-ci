name: Verify exact Books SHA
run-name: Books ${{ inputs.source_sha }}
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Disposable source ref in this repository
        required: true
        type: string
      source_sha:
        description: Private canonical source commit
        required: true
        type: string
      source_tree:
        description: Exact canonical source tree
        required: true
        type: string
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Verify transported source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
        run: |
          test "$(cat .books-source-sha)" = "$SOURCE_SHA"
          test "$(cat .books-source-tree)" = "$SOURCE_TREE"
          git rm --cached .books-source-sha .books-source-tree
          test "$(git write-tree)" = "$SOURCE_TREE"
          rm .books-source-sha .books-source-tree
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: node --check web/app.js
      - run: git diff --check
